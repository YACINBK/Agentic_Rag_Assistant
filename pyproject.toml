[project]
name = "whitecape-knowledge-assistant"
version = "0.1.0"
description = "RAG-based internal knowledge assistant for Whitecape Technologies"
requires-python = ">=3.11"
dependencies = [
    # -- Web framework --
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # -- LLM orchestration --
    "langgraph>=0.2",
    "litellm>=1.50",
    # -- Vector store --
    "qdrant-client>=1.12",
    # -- Database --
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # -- Task queue --
    "celery[redis]>=5.4",
    # -- Auth (session-based OIDC via authlib) --
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    # -- CSRF --
    "starlette-csrf>=3.0",
    # -- Redis (session store + broker) --
    "redis[hiredis]>=5.0",
    # -- Embeddings tokenizer (BGE-M3 chunk measurement) --
    "transformers>=4.45",
    # -- Settings --
    "pydantic-settings>=2.5",
    # -- Logging --
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    # Declared for tests/unit/test_m13_keycloak_realm.py, which parses
    # docker-compose.yml. It already arrives transitively via uvicorn[standard];
    # a test that imports it directly should not depend on that staying true.
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a real PostgreSQL at TEST_DATABASE_URL; skipped when unset",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

