<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Whitecape Knowledge Assistant{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {% block head %}{% endblock %}
</head>
<body hx-boost="true">
    <nav class="nav">
        <a href="/" class="nav-brand">Whitecape Knowledge</a>
        {% if user %}
        <div class="nav-right">
            <span class="nav-user">{{ user.email }}</span>
            <a href="/auth/logout" class="nav-link">Logout</a>
        </div>
        {% endif %}
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
