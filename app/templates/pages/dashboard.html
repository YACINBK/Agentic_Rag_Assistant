{% extends "base.html" %}

{% block title %}Dashboard — Whitecape Knowledge Assistant{% endblock %}

{% block content %}
<div class="dashboard">
    <h1>Welcome, {{ user.email }}</h1>

    <a href="/search" class="btn btn-primary">Search Knowledge Base</a>
</div>
{% endblock %}
