services:

  # ── FastAPI (serves UI + API + SSE) ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app/templates:/app/app/templates:ro
      - ./app/static:/app/app/static:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      keycloak:
        condition: service_started
      ollama:
        condition: service_started

  # ── Celery Worker ──
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.tasks.worker worker --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      qdrant:
        condition: service_started

  # ── Celery Beat (cache TTL cleanup) ──
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.tasks.worker beat --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whitecape
      POSTGRES_PASSWORD: whitecape
      POSTGRES_DB: whitecape
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whitecape"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis (session store + Celery broker + result backend) ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Qdrant (vector store + semantic cache) ──
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Keycloak (OIDC / SSO) ──
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  # ── Ollama (local LLM + BGE-M3 embeddings) ──
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Reranker (bge-reranker-v2-m3 via Hugging Face TEI, CPU) ──
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: --model-id BAAI/bge-reranker-v2-m3 --port 8082
    ports:
      - "8082:8082"
    volumes:
      - tei_cache:/data

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  keycloak_data:
  ollama_data:
  tei_cache:
